<!doctype html>
<!-- Projeto Designer — página única. Toda a interface é montada por src/main.js dentro dos elementos abaixo;
     este arquivo só define o "esqueleto" e carrega estilos e o script. -->
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projeto Designer</title>
  <meta name="description" content="Editor de design local em JavaScript puro, com auto layout em flexbox e exportação de CSS/HTML.">
  <!-- Ícone da aba: um SVG pequeno embutido (data URL), então não existe arquivo de ícone para carregar. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff5ca8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 6l2.6 6.4L25 15l-6.4 2.6L16 24l-2.6-6.4L7 15l6.4-2.6z' fill='%23fff'/%3E%3C/svg%3E">
  <!-- Fontes do Google (Inter, Poppins, DM Sans, Playfair Display, JetBrains Mono): OPCIONAIS, só para usar nos designs.
       Sem internet o app funciona igual, com as fontes do sistema. A interface em si usa fontes do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..900&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Playfair+Display:wght@400..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <!-- #app é um grid: barra superior, painel esquerdo (camadas/recursos), palco (canvas) e painel direito (design/protótipo/código). -->
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <aside class="panel left" id="left"></aside>
    <!-- Palco: #viewport é a janela do canvas (canvas.js e overlay.js criam o conteúdo dentro dele);
         #toolbar e #zoomw são as barras flutuantes (ferramentas e zoom). -->
    <main class="stage">
      <div class="viewport" id="viewport"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="zoom-widget" id="zoomw"></div>
    </main>
    <aside class="panel right" id="right"></aside>
  </div>
  <!-- Avisos curtos (toasts) aparecem aqui, na parte de baixo da tela. -->
  <div id="toasts" aria-live="polite"></div>
  <noscript>Este app precisa de JavaScript.</noscript>
  <!-- Único script: módulo ES. É por usar `import` que o app precisa de http:// (npm start), não de file://. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
