name: CI

on:
  push:
    branches: [main, v0.1.0-beta, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    name: Tipos e testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm test

  qualidade:
    name: Build do Studio e documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node docs/planning/validate-tasks.mjs

  navegador:
    name: Testes de navegador (Chromium)
    runs-on: ubuntu-latest
    needs: unitarios
    # O fluxo administrativo exige um servidor accounts isolado, ainda não preparado neste job.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # O teste atual conecta em APP_URL; não inicia o servidor por conta própria.
      - run: npm run test:e2e
