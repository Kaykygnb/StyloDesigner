name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unitarios:
    name: Testes unitários (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  navegador:
    name: Testes de navegador (Chromium)
    runs-on: ubuntu-latest
    needs: unitarios
    # Os testes de navegador estão desatualizados (usavam o chat embutido) e serão refeitos com a nova interface.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # o runner sobe um servidor isolado (porta livre, pasta de projetos temporária) e limita cada suíte a 4 min
      - run: npm run test:e2e
