name: Ideia ou pedido
description: Sugira algo que o Stylo poderia fazer
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema você quer resolver?
      description: Conte a situação, não só a solução. Ex.: "quero montar uma página de cardápio e não consigo X".
    validations:
      required: true
  - type: textarea
    id: ideia
    attributes:
      label: Como você imagina que funcione?
  - type: checkboxes
    id: ajuda
    attributes:
      label: Quer ajudar a construir?
      options:
        - label: Posso tentar implementar com orientação
