name: Bug
description: Algo não funciona como deveria
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: oque
    attributes:
      label: O que aconteceu
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra o editor (npm start → http://localhost:5173)
        2. Selecione...
        3. Clique em...
    validations:
      required: true
  - type: textarea
    id: diagnostico
    attributes:
      label: Diagnóstico
      description: Na Central de ajuda (tecla ?) → Suporte → "Copiar diagnóstico", e cole aqui.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Capturas, projeto de exemplo ou erro do console
