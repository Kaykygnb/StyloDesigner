name: Algo quebrou ou confundiu
description: Relate um erro, comportamento estranho ou algo difícil de entender
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Se puder, cole um print. Não existe relato pequeno demais.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como repetir
      placeholder: |
        1. Criei um projeto novo
        2. Apertei F e desenhei uma tela
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
  - type: input
    id: ambiente
    attributes:
      label: Sistema, navegador e versão do Node
      placeholder: "Windows 11, Chrome 130, Node 22.11"
  - type: dropdown
    id: modo
    attributes:
      label: Como você usa o Stylo?
      options:
        - Painel (com contas)
        - Painel (STYLO_AUTH=local)
        - Agente por MCP
        - Não sei dizer
