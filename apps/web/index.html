<!doctype html>
<!-- Stylo — página única. Toda a interface é montada por src/main.js dentro dos elementos abaixo;
     este arquivo só define o "esqueleto" e carrega estilos e o script. -->
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stylo</title>
  <meta name="description" content="Stylo — editor de design local onde o canvas é CSS de verdade: flexbox, grid, responsivo e exportação de HTML/CSS.">
  <!-- Ícone da aba: a marca do Stylo (assets/logo-mark.svg, o mesmo símbolo do topo). -->
  <link rel="icon" type="image/svg+xml" href="assets/logo-mark.svg">
  <!-- Fontes do Google (Inter, Poppins, DM Sans, Playfair Display, JetBrains Mono): OPCIONAIS, só para usar nos designs.
       Sem internet o app funciona igual, com as fontes do sistema. A interface em si usa fontes do sistema. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100..900&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..800&family=Playfair+Display:wght@400..900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
  <!-- #app é um grid: barra superior, painel esquerdo (camadas/recursos), palco (canvas) e painel direito (design/protótipo/código). -->
  <div id="app">
    <header class="topbar" id="topbar"></header>
    <aside class="panel left" id="left"></aside>
    <!-- Palco: #viewport é a janela do canvas (canvas.js e overlay.js criam o conteúdo dentro dele);
         #toolbar e #zoomw são as barras flutuantes (ferramentas e zoom). -->
    <main class="stage">
      <div class="viewport" id="viewport"></div>
      <div class="toolbar" id="toolbar"></div>
      <div class="zoom-widget" id="zoomw"></div>
    </main>
    <aside class="panel right" id="right"></aside>
  </div>
  <!-- Avisos curtos (toasts) aparecem aqui, na parte de baixo da tela. -->
  <div id="toasts" aria-live="polite"></div>
  <noscript>Este app precisa de JavaScript.</noscript>
  <!-- Único script: módulo ES. É por usar `import` que o app precisa de http:// (npm start), não de file://. -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
